[package]
name = "project"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
monoio = { version = "0.2", default-features = false, features = ["iouring", "legacy"] }
fast-float = "0.2"
memmap2 = "0.9"
memchr = "2"
mimalloc = { version = "0.1", default-features = false }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3