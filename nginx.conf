# One worker process is enough for local/dev use.
# In production the senior code uses 1 as well — monoio handles concurrency itself.
worker_processes 1;

events {
    # Max simultaneous connections this worker will handle.
    worker_connections 1024;
}

http {
    # "upstream" defines the pool of backend servers nginx will distribute to.
    # Default algorithm is round-robin: request 1 → api-1, request 2 → api-2, repeat.
    upstream api {
        server api-1:8080;  # Docker resolves "api-1" to the container IP automatically.
        server api-2:8080;  # Same for "api-2".

        # Reuse TCP connections to backends instead of opening a new one per request.
        keepalive 64;
    }

    server {
        # nginx listens here. This is the port clients talk to.
        listen 9999;

        location / {
            # Forward every request to the upstream pool above.
            proxy_pass http://api;

            # Required to enable keepalive connections to the upstream.
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
