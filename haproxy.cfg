global
    log /dev/log local0 crit
    maxconn 8192
    nbthread 1

defaults
    log     global
    mode    http
    option  dontlognull
    timeout connect 100ms
    timeout client  2s
    timeout server  2s
    timeout queue   2s
    timeout http-keep-alive 5s

frontend http_in
    bind *:9999 backlog 1024
    maxconn 8192
    default_backend api_servers

backend api_servers
    mode http
    balance roundrobin
    http-reuse always
    default-server maxconn 300
    server api1 unix@/sockets/api1.sock
    server api2 unix@/sockets/api2.sock
