global
    log /dev/log local0 crit
    maxconn 4096
    nbthread 1

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    timeout http-keep-alive 300s
    timeout queue   10s

frontend http_in
    bind *:9999
    default_backend api_servers

backend api_servers
    balance roundrobin
    option http-server-close
    option forwardfor
    http-reuse always
    server api1 unix@/sockets/api1.sock
    server api2 unix@/sockets/api2.sock