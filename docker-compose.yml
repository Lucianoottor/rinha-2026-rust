services:
  api-1:
    platform: linux/amd64
    build: .
    environment:
      - INDEX_PATH=/data/index.bin
    volumes:
      - ./index.bin:/data/index.bin:ro
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "165M"

  api-2:
    platform: linux/amd64
    build: .
    environment:
      - INDEX_PATH=/data/index.bin
    volumes:
      - ./index.bin:/data/index.bin:ro
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "165M"

  nginx:
    platform: linux/amd64
    image: nginx:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "20M"
