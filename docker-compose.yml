services:
  api-1:
    platform: linux/amd64
    image: ghcr.io/lucianoottor/rinha-2026-rust:latest
    environment:
      - SOCK_PATH=/sockets/api1.sock
    volumes:
      - sockets:/sockets
    healthcheck:
      test: ["CMD", "sh", "-c", "test -S /sockets/api1.sock"]
      interval: 1s
      timeout: 2s
      retries: 15
      start_period: 2s
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: "165M"

  api-2:
    platform: linux/amd64
    image: ghcr.io/lucianoottor/rinha-2026-rust:latest
    environment:
      - SOCK_PATH=/sockets/api2.sock
    volumes:
      - sockets:/sockets
    healthcheck:
      test: ["CMD", "sh", "-c", "test -S /sockets/api2.sock"]
      interval: 1s
      timeout: 2s
      retries: 15
      start_period: 2s
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: "165M"

  haproxy:
    platform: linux/amd64
    image: haproxy:latest
    ports:
      - "9999:9999"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - sockets:/sockets
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9999'"]
      interval: 1s
      timeout: 2s
      retries: 15
      start_period: 2s
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "20M"

volumes:
  sockets: