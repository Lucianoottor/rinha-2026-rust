services:
  api-1:
    platform: linux/amd64
    image: ghcr.io/lucianoottor/rinha-2026-rust:latest
    environment:
      - SOCK_PATH=/sockets/api1.sock
    volumes:
      - sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "165M"
  api-2:
    platform: linux/amd64
    image: ghcr.io/lucianoottor/rinha-2026-rust:latest
    environment:
      - SOCK_PATH=/sockets/api2.sock
    volumes:
      - sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "165M"
  nginx:
    platform: linux/amd64
    image: nginx:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - sockets:/sockets
    depends_on:
      - api-1
      - api-2
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "20M"
volumes:
  sockets:
