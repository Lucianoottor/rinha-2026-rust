services:
  api-1:
    platform: linux/amd64
    build: .
    environment:
      - DATA_PATH=/app/resources/references.json.gz
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: "1000M"

  api-2:
    platform: linux/amd64
    build: .
    environment:
      - DATA_PATH=/app/resources/references.json.gz
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: "1000M"

  nginx:
    platform: linux/amd64
    image: nginx:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "100M"
